# User override of /usr/share/xdg-desktop-portal/niri-portals.conf.
#
# xdg-desktop-portal-gnome's FileChooser implementation doesn't show its own
# dialog -- it delegates the request to GNOME Shell's own file chooser over
# D-Bus. That service only exists when GNOME Shell is actually the running
# compositor. Under niri it doesn't exist, so the delegate call fails
# ("The name is not activatable") and no dialog opens at all -- every
# Flatpak app's "Select files"/"Open"/"Save" button just silently does
# nothing. Pin FileChooser to gtk directly so it uses
# xdg-desktop-portal-gtk's real dialog instead of trying to delegate.
#
# Everything else stays on the system default (gnome first, falling back to
# gtk) since only FileChooser has this delegate-only failure mode.

[preferred]
default=gnome;gtk;
org.freedesktop.impl.portal.Access=gtk;
org.freedesktop.impl.portal.FileChooser=gtk;
org.freedesktop.impl.portal.Notification=gtk;
org.freedesktop.impl.portal.Secret=gnome-keyring;
